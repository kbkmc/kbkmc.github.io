<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Моя страница ссылок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&amp;family=Unbounded:wght@600;800&amp;family=Rubik:wght@400;600;800&amp;family=Lora:wght@500;700&amp;display=swap">
<style id="app-style">
/* Микролендинг для шапки профиля: одна узкая колонка под телефон. Цвета и шрифт задаёт владелец (стиль #theme). */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-block:40px 120px;display:flex;flex-direction:column;gap:14px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:10px}
.ava{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--accent)}
.ava.empty{display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:800 2.4rem var(--display)}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
.bio{margin:0;max-width:34ch;opacity:.8;white-space:pre-line;text-wrap:pretty}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px 20px;border-radius:var(--radius);
  font-weight:700;text-align:center;text-decoration:none;color:var(--fg);background:var(--card);
  border:2px solid color-mix(in srgb,var(--fg) 14%,transparent);transition:transform .15s}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);outline:none}
a.btn:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.nolink{opacity:.55}
.heading{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:14px 0 0;text-align:center;text-wrap:balance}
.text{margin:0;text-align:center;white-space:pre-line;opacity:.85}
.pic{margin:0;display:flex;flex-direction:column;gap:6px}
.pic img{width:100%;border-radius:var(--radius);display:block}
.pic figcaption{font-size:.85rem;opacity:.7;text-align:center}
/* телефон: отдельные картинки сверху и снизу вместо широкого баннера */
.mlogo{display:none;width:100%;max-width:420px;margin:0 auto;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%)}
@media (max-width:899px){.has-mlogo .mlogo{display:block}.has-mlogo #app{padding-top:16px}}
/* компьютер: логотипы по бокам колонки, каждый по центру свободного места */
.side{position:fixed;top:0;bottom:0;width:calc(50vw - 240px);display:none;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.side.l{left:0}.side.r{right:0}
.side img{width:min(440px,88%);display:block;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%)}
@media (min-width:900px){.has-mlogo .side{display:flex}}
#bgimg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat}
.divider{border:0;height:1px;background:color-mix(in srgb,var(--fg) 15%,transparent);margin:8px 0;width:100%}
/* ── режим правки (виден только владельцу) ── */
.edit-toggle{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:20;font:700 14px var(--body);padding:12px 18px;border-radius:999px;border:0;cursor:pointer;
  background:var(--fg);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:#16171b;color:#f2f2f2;font:600 14px "Manrope",system-ui,sans-serif;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.bar .status{flex-basis:100%;text-align:center;font-weight:400;opacity:.8;min-height:1.2em}
.ui{font:600 14px "Manrope",system-ui,sans-serif;padding:10px 14px;border-radius:10px;border:1px solid #3a3c44;background:#24262c;color:#f2f2f2;cursor:pointer}
.ui:hover,.ui:focus-visible{border-color:#8fb3ff;outline:none}
.ui.go{background:#2f6bff;border-color:#2f6bff}
.ui.danger{color:#ff8a80}
.ui:disabled{opacity:.5;cursor:default}
.ed{position:relative;outline:2px dashed color-mix(in srgb,var(--fg) 30%,transparent);outline-offset:4px;border-radius:calc(var(--radius) + 4px)}
.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}
.tools button{font:600 13px "Manrope",system-ui,sans-serif;width:34px;height:30px;border-radius:8px;border:1px solid #3a3c44;background:#24262c;color:#f2f2f2;cursor:pointer}
.tools button:hover,.tools button:focus-visible{border-color:#8fb3ff;outline:none}
.form{display:flex;flex-direction:column;gap:10px;padding:14px;margin-top:8px;border-radius:12px;background:#1d1e23;color:#f2f2f2;
  font:400 14px "Manrope",system-ui,sans-serif;text-align:left}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.form input[type=text],.form input[type=url],.form textarea,.form select{font:400 15px "Manrope",system-ui,sans-serif;padding:10px;border-radius:8px;
  border:1px solid #3a3c44;background:#111216;color:#f2f2f2;width:100%}
.form textarea{min-height:80px;resize:vertical}
.form .row{display:flex;flex-wrap:wrap;gap:8px}
.form .colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.form input[type=color]{width:100%;height:40px;border:1px solid #3a3c44;border-radius:8px;background:#111216;padding:2px}
.form .hint{font-size:12px;opacity:.65;font-weight:400}
.add{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;border-radius:12px;border:2px dashed color-mix(in srgb,var(--fg) 25%,transparent)}
.add .lbl{flex-basis:100%;text-align:center;font-weight:700;font-size:14px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<script id="app-code">
(function () {
  "use strict";
  var FONTS = {
    unbounded: { label: "Unbounded + Manrope (смелый)", display: '"Unbounded"', body: '"Manrope"' },
    manrope: { label: "Manrope (чистый)", display: '"Manrope"', body: '"Manrope"' },
    rubik: { label: "Rubik (мягкий)", display: '"Rubik"', body: '"Rubik"' },
    lora: { label: "Lora + Manrope (с засечками)", display: '"Lora"', body: '"Manrope"' }
  };
  var TYPES = { button: "Кнопка", heading: "Заголовок", text: "Текст", image: "Картинка", divider: "Линия" };
  var RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}" +
    "body{margin:0;font:14px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}";

  var saved = JSON.parse(document.getElementById("state").textContent);
  var state = JSON.parse(JSON.stringify(saved));
  var app = document.getElementById("app");
  var editing = false, dirty = false, openId = null, art = null, canEdit = false, busy = false, statusText = "";

  function hex(c, d) { return /^#[0-9a-f]{6}$/i.test(c || "") ? c : d; }
  function isDark(c) {
    var n = parseInt(c.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) < 140;
  }
  function safeUrl(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (/^(https?:|mailto:|tel:|tg:)/i.test(u)) return u;
    if (/^@[\w.]+$/.test(u)) return "";
    if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(u)) return "https://" + u;
    return "";
  }
  function uid() { return "b" + Math.random().toString(36).slice(2, 9); }
  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "text") e.textContent = v;
      else if (k === "on") for (var ev in v) e.addEventListener(ev, v[ev]);
      else if (k === "cls") e.className = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      (Array.isArray(c) ? c : [c]).forEach(function (x) { if (x != null) e.append(x); });
    }
    return e;
  }

  function themeCss() {
    var t = state.theme || {}, f = FONTS[t.font] || FONTS.unbounded;
    var bg = hex(t.bg, "#fff6ec"), fg = hex(t.fg, "#1d1a17"), ac = hex(t.accent, "#ff5a36"), on = hex(t.onAccent, "#ffffff");
    var r = Math.max(0, Math.min(40, +t.radius || 0));
    return ":root{--bg:" + bg + ";--fg:" + fg + ";--accent:" + ac + ";--on-accent:" + on +
      ";--card:color-mix(in srgb," + fg + " 6%," + bg + ");--radius:" + r + "px;--display:" + f.display +
      ",system-ui,sans-serif;--body:" + f.body + ",system-ui,sans-serif;color-scheme:" + (isDark(bg) ? "dark" : "light") + "}" + bgCss(t);
  }
  // фоновая картинка: «cover» — на весь экран (края обрезаются), «top» — целиком полосой сверху
  function bgCss(t) {
    if (!t.bgImage || t.bgImage.indexOf("data:image/") !== 0) return "";
    var dim = Math.max(0, Math.min(0.85, t.bgDim == null ? 0.25 : +t.bgDim));
    var ratio = Math.max(0.1, Math.min(3, +t.bgRatio || 0.4));
    var layer = "linear-gradient(rgba(0,0,0," + dim + "),rgba(0,0,0," + dim + ")),url(\"" + t.bgImage + "\")";
    if (t.bgFit === "cover") return "#bgimg{background-image:" + layer + ";background-size:cover;background-position:center}";
    return "#bgimg{background-image:" + layer + ";background-size:min(100vw,1100px) auto;background-position:center top}" +
      "#app{padding-top:max(40px,calc(min(100vw,1100px)*" + ratio.toFixed(3) + " - 20px))}";
  }
  function applyTheme() {
    document.getElementById("theme").textContent = themeCss();
    document.title = state.title || "Моя страница ссылок";
  }

  // ── картинка с телефона/компьютера → уменьшенная, прямо внутрь страницы ──
  function readImage(file, max, square) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onerror = rej;
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { rej(new Error("bad image")); };
        img.onload = function () {
          var sx = 0, sy = 0, sw = img.width, sh = img.height;
          if (square) { var s = Math.min(sw, sh); sx = (sw - s) / 2; sy = (sh - s) / 2; sw = sh = s; }
          var k = Math.min(1, max / Math.max(sw, sh));
          var c = document.createElement("canvas");
          c.width = Math.round(sw * k); c.height = Math.round(sh * k);
          c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
          var d = c.toDataURL("image/webp", 0.82);
          if (d.indexOf("data:image/webp") !== 0) d = c.toDataURL("image/jpeg", 0.85);
          res({ d: d, w: c.width, h: c.height });
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function filePicker(onData, max, square) {
    return h("input", { type: "file", accept: "image/*", on: { change: function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      readImage(f, max, square).then(function (r) { onData(r.d, r.w, r.h); touch(); render(); })
        .catch(function () { setStatus("Не получилось открыть картинку. Попробуй JPG или PNG."); });
    } } });
  }

  function touch() { dirty = true; }
  function setStatus(t) { statusText = t; var s = document.querySelector(".bar .status"); if (s) s.textContent = t; }

  // ── показ блоков ──
  function viewBlock(b) {
    if (b.type === "button") {
      var url = safeUrl(b.url);
      var cls = "btn" + (b.main ? " main" : "") + (url ? "" : " nolink");
      return url ? h("a", { cls: cls, href: url, target: "_blank", rel: "noopener", text: b.label || "Кнопка" })
                 : h("div", { cls: cls, text: (b.label || "Кнопка") + (editing ? " (нет ссылки)" : "") });
    }
    if (b.type === "heading") return h("h2", { cls: "heading", text: b.text || "Заголовок" });
    if (b.type === "text") return h("p", { cls: "text", text: b.text || "" });
    if (b.type === "divider") return h("hr", { cls: "divider" });
    if (b.type === "image") {
      if (!b.src) return editing ? h("div", { cls: "btn nolink", text: "Картинка не выбрана" }) : null;
      var img = h("img", { src: b.src, alt: b.caption || "" });
      var link = safeUrl(b.url);
      return h("figure", { cls: "pic" }, link ? h("a", { href: link, target: "_blank", rel: "noopener" }, img) : img,
        b.caption ? h("figcaption", { text: b.caption }) : null);
    }
    return null;
  }

  function field(label, value, onInput, opts) {
    opts = opts || {};

  }
  function doneBtn() { return h("button", { cls: "ui go", type: "button", text: "Готово", on: { click: function () { openId = null; render(); } } }); }

  function blockForm(b) {
    var f = h("div", { cls: "form" });
    if (b.type === "button") {
      f.append(field("Текст на кнопке", b.label, function (v) { b.label = v; }, { id: "f-label-" + b.id }));
      f.append(field("Ссылка", b.url, function (v) { b.url = v; }, { id: "f-url-" + b.id, type: "url", ph: "https://t.me/твой_ник",
        hint: "Можно без https:// — например t.me/ник или youtube.com/@канал" }));
      var cb = h("input", { type: "checkbox", id: "f-main-" + b.id });

      cb.addEventListener("change", function () { b.main = cb.checked; touch(); });

    } else if (b.type === "heading" || b.type === "text") {
      f.append(field(b.type === "heading" ? "Заголовок" : "Текст", b.text, function (v) { b.text = v; }, { id: "f-text-" + b.id, multi: b.type === "text" }));
    } else if (b.type === "image") {
      f.append(h("label", null, "Картинка", filePicker(function (d) { b.src = d; }, 900, false),
        h("span", { cls: "hint", text: "Картинка уменьшается и хранится прямо в странице. Лучше не больше 5–6 штук." })));
      f.append(field("Подпись (необязательно)", b.caption, function (v) { b.caption = v; }, { id: "f-cap-" + b.id }));
      f.append(field("Ссылка при нажатии (необязательно)", b.url, function (v) { b.url = v; }, { id: "f-iurl-" + b.id, type: "url" }));
    } else {

    }

  }

  function profileForm() {
    var f = h("div", { cls: "form" });
    f.append(field("Имя или название", state.name, function (v) { state.name = v; }, { id: "f-name" }));
    f.append(field("Описание", state.bio, function (v) { state.bio = v; }, { id: "f-bio", multi: true }));
    f.append(h("label", null, "Аватарка", filePicker(function (d) { state.avatar = d; }, 400, true)));
    if (state.avatar) f.append(h("div", { cls: "row" }, h("button", { cls: "ui danger", type: "button", text: "Убрать аватарку",
      on: { click: function () { state.avatar = ""; touch(); render(); } } })));
    f.append(h("div", { cls: "row" }, doneBtn()));
    return f;
  }

  function themeForm() {
    var t = state.theme;
    var f = h("div", { cls: "form" });
    f.append(field("Название вкладки браузера", state.title, function (v) { state.title = v; }, { id: "f-title" }));
    function color(label, key, d) {
      var i = h("input", { type: "color", id: "f-c-" + key });
      i.value = hex(t[key], d);
      i.addEventListener("input", function () { t[key] = i.value; touch(); applyTheme(); });
      return h("label", null, label, i);
    }
    f.append(h("div", { cls: "colors" }, color("Фон", "bg", "#fff6ec"), color("Текст", "fg", "#1d1a17"),
      color("Главный цвет", "accent", "#ff5a36"), color("Текст на главной кнопке", "onAccent", "#ffffff")));
    var sel = h("select", { id: "f-font" });
    Object.keys(FONTS).forEach(function (k) { var o = h("option", { value: k, text: FONTS[k].label }); if (t.font === k) o.selected = true; sel.append(o); });
    sel.addEventListener("change", function () { t.font = sel.value; touch(); applyTheme(); });
    f.append(h("label", null, "Шрифт", sel));
    f.append(h("label", null, "Фоновая картинка", filePicker(function (d, w, hh) { t.bgImage = d; t.bgRatio = hh / w; }, 1400, false),
      h("span", { cls: "hint", text: "Широкий баннер лучше показывать «полосой сверху» — тогда на телефоне ничего не обрежется." })));
    function mPic(label, key) {
      return h("label", null, label, filePicker(function (d) { t[key] = d; }, 800, false),
        t[key] ? h("button", { cls: "ui danger", type: "button", text: "Убрать", on: { click: function () { delete t[key]; touch(); render(); } } }) : null);
    }
    f.append(h("span", { cls: "hint", text: "Логотипы: на телефоне — первый сверху, второй снизу; на компьютере — первый слева, второй справа от колонки." }));
    f.append(mPic("Логотип 1 (сверху / слева)", "mTop"));
    f.append(mPic("Логотип 2 (снизу / справа)", "mBottom"));
    if (t.bgImage) {
      var fit = h("select", { id: "f-bgfit" });
      [["top", "Полосой сверху, целиком"], ["cover", "На весь экран (края обрежутся)"]].forEach(function (o) {
        var op = h("option", { value: o[0], text: o[1] }); if ((t.bgFit || "top") === o[0]) op.selected = true; fit.append(op); });
      fit.addEventListener("change", function () { t.bgFit = fit.value; touch(); applyTheme(); });
      f.append(h("label", null, "Как показывать фон", fit));
      var dimR = h("input", { type: "range", min: "0", max: "0.8", step: "0.05", id: "f-bgdim" });
      dimR.value = t.bgDim == null ? 0.25 : t.bgDim;
      dimR.addEventListener("input", function () { t.bgDim = +dimR.value; touch(); applyTheme(); });
      f.append(h("label", null, "Затемнение фона", dimR));
      f.append(h("div", { cls: "row" }, h("button", { cls: "ui danger", type: "button", text: "Убрать фон",
        on: { click: function () { delete t.bgImage; touch(); render(); } } })));
    }
    var rad = h("input", { type: "range", min: "0", max: "32", step: "2", id: "f-radius" });
    rad.value = t.radius == null ? 16 : t.radius;
    rad.addEventListener("input", function () { t.radius = +rad.value; touch(); applyTheme(); });
    f.append(h("label", null, "Скругление кнопок", rad));
    var presets = [["Светлый", "#fff6ec", "#1d1a17", "#ff5a36", "#ffffff"], ["Ночь", "#101114", "#f1efe9", "#ff7a1a", "#1a0c02"],
      ["Мята", "#eefaf4", "#10302a", "#0f9d74", "#ffffff"], ["Неон", "#0c0b1d", "#f3f0ff", "#9b5cff", "#ffffff"], ["Розовый", "#fff0f5", "#3a0d22", "#ff3d8b", "#ffffff"]];
    f.append(h("div", { cls: "row" }, presets.map(function (p) {
      return h("button", { cls: "ui", type: "button", text: p[0], on: { click: function () {
        t.bg = p[1]; t.fg = p[2]; t.accent = p[3]; t.onAccent = p[4]; touch(); applyTheme(); render(); } } });
    })));
    f.append(h("div", { cls: "row" }, doneBtn()));
    return f;
  }

  function move(i, d) {
    var j = i + d, bs = state.blocks;
    if (j < 0 || j >= bs.length) return;
    var x = bs[i]; bs[i] = bs[j]; bs[j] = x; touch(); render();
  }
  function tools(i, b) {
    function tb(label, title, fn) { return h("button", { type: "button", title: title, "aria-label": title, text: label, on: { click: fn } }); }
    return h("div", { cls: "tools" },
      tb("↑", "Выше", function () { move(i, -1); }),
      tb("↓", "Ниже", function () { move(i, 1); }),
      tb("✎", "Изменить", function () { openId = openId === b.id ? null : b.id; render(); }),
      tb("✕", "Удалить", function () {
        if (b._confirm) { state.blocks.splice(i, 1); touch(); render(); return; }
        b._confirm = true; setStatus("Нажми ✕ ещё раз, чтобы удалить «" + TYPES[b.type] + "»");
        setTimeout(function () { delete b._confirm; }, 4000);
      }));
  }

  function render() {
    applyTheme();
    if (!document.getElementById("bgimg")) document.body.prepend(h("div", { id: "bgimg", "aria-hidden": "true" }));
    var th = state.theme || {};
    document.documentElement.classList.toggle("has-mlogo", !!(th.mTop || th.mBottom));
    [["l", th.mTop], ["r", th.mBottom]].forEach(function (p) {
      var s = document.querySelector(".side." + p[0]);
      if (!s) { s = h("div", { cls: "side " + p[0], "aria-hidden": "true" }, h("img", { alt: "" })); document.body.prepend(s); }
      s.hidden = !p[1];
      if (p[1]) s.firstChild.src = p[1];
    });
    app.textContent = "";
    if (th.mTop) app.append(h("img", { cls: "mlogo", src: th.mTop, alt: "" }));
    var ava = state.avatar ? h("img", { cls: "ava", src: state.avatar, alt: state.name || "" })
                           : h("div", { cls: "ava empty", text: (state.name || "?").trim().charAt(0).toUpperCase() || "?" });
    var prof = h("header", { cls: "profile" }, ava, h("h1", { text: state.name || "" }), state.bio ? h("p", { cls: "bio", text: state.bio }) : null);
    if (editing) {
      var wrap = h("div", { cls: "ed" }, h("div", { cls: "tools" },
        h("button", { type: "button", title: "Изменить шапку", "aria-label": "Изменить шапку", text: "✎", on: { click: function () { openId = openId === "profile" ? null : "profile"; render(); } } })),
        prof, openId === "profile" ? profileForm() : null);
      app.append(wrap);
    } else app.append(prof);

    state.blocks.forEach(function (b, i) {
      var v = viewBlock(b);
      if (!editing) { if (v) app.append(v); return; }
      app.append(h("div", { cls: "ed" }, tools(i, b), v, openId === b.id ? blockForm(b) : null));
    });

    if (th.mBottom) app.append(h("img", { cls: "mlogo", src: th.mBottom, alt: "" }));

    if (editing) {
      app.append(h("div", { cls: "add" }, h("span", { cls: "lbl", text: "Добавить" }),
        Object.keys(TYPES).map(function (t) {
          return h("button", { cls: "ui", type: "button", text: "+ " + TYPES[t], on: { click: function () {
            var b = { id: uid(), type: t };
            if (t === "button") { b.label = "Новая кнопка"; b.url = ""; b.main = false; }
            if (t === "heading") b.text = "Заголовок";
            if (t === "text") b.text = "Новый текст";
            state.blocks.push(b); openId = t === "divider" ? null : b.id; touch(); render();
            var el = document.getElementById("f-label-" + b.id) || document.getElementById("f-text-" + b.id);
            if (el) { el.focus(); el.select && el.select(); }
          } } });
        })));
      if (openId === "theme") app.append(themeForm());
    }
    renderChrome();
  }

  function renderChrome() {
    var old = document.querySelectorAll(".edit-toggle,.bar");
    old.forEach(function (n) { n.remove(); });
    if (!canEdit) return;
    if (!editing) {
      document.body.append(h("button", { cls: "edit-toggle", type: "button", text: "✎ Редактировать", on: { click: function () {
        editing = true; render(); } } }));
      return;
    }
    document.body.append(h("div", { cls: "bar", role: "toolbar", "aria-label": "Режим правки" },
      h("button", { cls: "ui", type: "button", text: "Оформление", on: { click: function () { openId = openId === "theme" ? null : "theme"; render();
        if (openId === "theme") window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }); } } }),
      h("button", { cls: "ui", type: "button", text: "Отменить", on: { click: function () {
        state = JSON.parse(JSON.stringify(saved)); dirty = false; editing = false; openId = null; statusText = ""; render(); } } }),
      h("button", { cls: "ui go", type: "button", text: busy ? "Сохраняю…" : "Сохранить", disabled: busy, on: { click: save } }),
      h("span", { cls: "status", text: statusText || (dirty ? "Есть несохранённые изменения" : "Посетители видят только готовую страницу") })));
  }

  // ── сохранение: страница публикует саму себя с новыми данными ──
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function buildDoc() {
    var clean = JSON.parse(JSON.stringify(state, function (k, v) { return k.charAt(0) === "_" ? undefined : v; }));
    var json = JSON.stringify(clean).replace(/</g, "\\u003c");
    var font = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis.com"]');
    var C = "</" + "script>";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      RESET + "</style></head><body>" +
      "<title>" + esc(clean.title || "Моя страница ссылок") + "</title>\n" +
      '<meta name="claude:viewport-fit-sides" content="cover">\n' +
      (font ? font.outerHTML + "\n" : "") +
      document.getElementById("app-style").outerHTML + "\n" +
      '<style id="theme">' + themeCss() + "</style>\n" +
      '<main id="app"></main>\n' +
      '<script type="application/json" id="state">' + json + C + "\n" +
      '<script id="app-code">' + document.getElementById("app-code").textContent + C +
      "</body></html>";
  }
  function save() {
    if (!art || busy) return;
    if (!dirty) { editing = false; openId = null; render(); return; }
    busy = true; setStatus("Сохраняю…"); renderChrome();
    art.publish(buildDoc()).then(function () {
      dirty = false; busy = false; setStatus("Сохранено. Страница обновится сама.");
    }).catch(function (e) {
      busy = false;
      var c = e && e.code;
      if (c === "conflict") setStatus("Страницу только что сохранили в другом окне — она перезагрузится.");
      else if (c === "not_writer" || c === "not_granted" || c === "not_declared" || c === "consent_required") {
        canEdit = false; editing = false; render(); return;
      } else if (c === "too_large") setStatus("Слишком много или слишком большие картинки — убери одну-две и сохрани снова.");
      else if (c === "rate_limited") setStatus("Слишком часто сохраняешь — подожди минуту.");
      else setStatus("Не сохранилось из-за ошибки сервера. Нажми «Сохранить» ещё раз.");
      renderChrome();
    });
  }

  window.addEventListener("beforeunload", function (e) { if (dirty && !busy) { e.preventDefault(); e.returnValue = ""; } });

  render();

})();
