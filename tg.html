<!doctype html><html lang="ru"><head><script src="https://telegram.org/js/telegram-web-app.js?64"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Моя страница ссылок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&amp;family=Unbounded:wght@600;800&amp;family=Rubik:wght@400;600;800&amp;family=Lora:wght@500;700&amp;display=swap">
<style id="app-style">
/* Микролендинг для шапки профиля: одна узкая колонка под телефон. Цвета и шрифт задаёт владелец (стиль #theme). */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-block:40px 120px;display:flex;flex-direction:column;gap:14px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:10px}
.ava{width:112px;height:112px;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--accent)}
.ava.empty{display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:800 2.4rem var(--display)}
h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
.bio{margin:0;max-width:34ch;opacity:.8;white-space:pre-line;text-wrap:pretty}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px 20px;border-radius:var(--radius);
  font-weight:700;text-align:center;text-decoration:none;color:var(--fg);background:var(--card);
  border:2px solid color-mix(in srgb,var(--fg) 14%,transparent);transition:transform .15s}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);outline:none}
a.btn:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn.nolink{opacity:.55}
.heading{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:14px 0 0;text-align:center;text-wrap:balance}
.text{margin:0;text-align:center;white-space:pre-line;opacity:.85}
.pic{margin:0;display:flex;flex-direction:column;gap:6px}
.pic img{width:100%;border-radius:var(--radius);display:block}
.pic figcaption{font-size:.85rem;opacity:.7;text-align:center}
/* телефон: отдельные картинки сверху и снизу вместо широкого баннера */
.mlogo{display:none;width:100%;max-width:420px;margin:0 auto;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%)}
@media (max-width:899px){.has-mlogo .mlogo{display:block}.has-mlogo #app > .mlogo:first-child{display:none}.has-mlogo #app{padding-top:28px}}
/* компьютер: логотипы по бокам колонки, каждый по центру свободного места */
.side{position:fixed;top:0;bottom:0;width:calc(50vw - 240px);display:none;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.side.l{left:0}.side.r{right:0}
.side img{width:min(440px,88%);display:block;
  -webkit-mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at center,#000 58%,transparent 100%)}
@media (min-width:900px){.has-mlogo .side{display:flex}}
#bgimg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat}
.divider{border:0;height:1px;background:color-mix(in srgb,var(--fg) 15%,transparent);margin:8px 0;width:100%}
/* ── режим правки (виден только владельцу) ── */
.edit-toggle{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:20;font:700 14px var(--body);padding:12px 18px;border-radius:999px;border:0;cursor:pointer;
  background:var(--fg);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:#16171b;color:#f2f2f2;font:600 14px "Manrope",system-ui,sans-serif;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.bar .status{flex-basis:100%;text-align:center;font-weight:400;opacity:.8;min-height:1.2em}
.ui{font:600 14px "Manrope",system-ui,sans-serif;padding:10px 14px;border-radius:10px;border:1px solid #3a3c44;background:#24262c;color:#f2f2f2;cursor:pointer}
.ui:hover,.ui:focus-visible{border-color:#8fb3ff;outline:none}
.ui.go{background:#2f6bff;border-color:#2f6bff}
.ui.danger{color:#ff8a80}
.ui:disabled{opacity:.5;cursor:default}
.ed{position:relative;outline:2px dashed color-mix(in srgb,var(--fg) 30%,transparent);outline-offset:4px;border-radius:calc(var(--radius) + 4px)}
.tools{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px}
.tools button{font:600 13px "Manrope",system-ui,sans-serif;width:34px;height:30px;border-radius:8px;border:1px solid #3a3c44;background:#24262c;color:#f2f2f2;cursor:pointer}
.tools button:hover,.tools button:focus-visible{border-color:#8fb3ff;outline:none}
.form{display:flex;flex-direction:column;gap:10px;padding:14px;margin-top:8px;border-radius:12px;background:#1d1e23;color:#f2f2f2;
  font:400 14px "Manrope",system-ui,sans-serif;text-align:left}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.form input[type=text],.form input[type=url],.form textarea,.form select{font:400 15px "Manrope",system-ui,sans-serif;padding:10px;border-radius:8px;
  border:1px solid #3a3c44;background:#111216;color:#f2f2f2;width:100%}
.form textarea{min-height:80px;resize:vertical}
.form .row{display:flex;flex-wrap:wrap;gap:8px}
.form .colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.form input[type=color]{width:100%;height:40px;border:1px solid #3a3c44;border-radius:8px;background:#111216;padding:2px}
.form .hint{font-size:12px;opacity:.65;font-weight:400}
.add{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;border-radius:12px;border:2px dashed color-mix(in srgb,var(--fg) 25%,transparent)}
.add .lbl{flex-basis:100%;text-align:center;font-weight:700;font-size:14px}
/* ── блок «Промо»: карусель в светящейся рамке + промокод, который копируется по нажатию ── */
.promo{display:flex;flex-direction:column;gap:12px;margin:2px 0 6px}
.pr-frame{position:relative;padding:3px;border-radius:calc(var(--radius) + 6px);overflow:hidden;isolation:isolate;
  box-shadow:0 10px 40px -8px rgba(255,122,0,.45)}
.pr-frame::before{content:"";position:absolute;inset:-60%;z-index:-1;
  background:conic-gradient(from 0deg,#ff7a00,#ffc04d,var(--accent),#8a3dff,#ff7a00);animation:pr-spin 6s linear infinite}
.pr-stage{position:relative;aspect-ratio:1;border-radius:calc(var(--radius) + 3px);overflow:hidden;background:#07070a;touch-action:pan-y}
.pr-slide{position:absolute;inset:0;display:block;opacity:0;transform:scale(1.04);pointer-events:none;
  transition:opacity .6s ease,transform 1s ease}
.pr-slide.on{opacity:1;transform:none;pointer-events:auto}
.pr-slide video,.pr-slide img{width:100%;height:100%;object-fit:cover;display:block}
.pr-dots{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;justify-content:center;gap:6px}
.pr-dot{width:8px;height:8px;padding:0;border:0;border-radius:99px;background:rgba(255,255,255,.45);cursor:pointer;transition:width .3s,background .3s}
.pr-dot.on{width:22px;background:#fff}
.pr-empty{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:#f2f2f2;opacity:.7}
.pr-code{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;padding:10px 12px 10px 18px;cursor:pointer;
  border-radius:var(--radius);border:2px dashed #ff8a1f;color:var(--fg);font:inherit;text-align:left;
  background:linear-gradient(135deg,rgba(255,122,0,.18),rgba(255,122,0,.04));animation:pr-pulse 2.4s ease-in-out infinite}
.pr-code:focus-visible{outline:3px solid color-mix(in srgb,#ff8a1f 60%,transparent);outline-offset:2px}
.pr-txt{display:flex;flex-direction:column;flex:1;min-width:0}
.pr-lbl{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.pr-code b{font-family:var(--display);font-size:1.4rem;line-height:1.2;letter-spacing:.05em;color:#ff8a1f;
  text-shadow:0 0 18px rgba(255,122,0,.55);overflow-wrap:anywhere}
.pr-cp{flex:none;padding:9px 14px;border-radius:999px;background:#ff7a00;color:#1a0c02;font-size:.85rem;font-weight:800;white-space:nowrap}
.pr-code.done{border-style:solid;border-color:#2ee59d;animation:none}
.pr-code.done .pr-cp{background:#2ee59d}
.pr-note{margin:-4px 0 0;text-align:center;font-size:.85rem;opacity:.75;text-wrap:balance}
.form .slides{display:flex;flex-wrap:wrap;gap:8px}
.form .slides figure{margin:0;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px}
.form .slides img,.form .slides video{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block;background:#000}
@keyframes pr-spin{to{transform:rotate(1turn)}}
@keyframes pr-pulse{50%{box-shadow:0 0 24px 2px rgba(255,122,0,.35)}}
@media (prefers-reduced-motion:reduce){.pr-frame::before,.pr-code{animation:none}.pr-slide{transition:none}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<script>
// заставка при открытии: промо-ролик (тот же, что в блоке «Промо») на весь экран, «Пропустить», потом визитка
(function () {
  try {
    var st = JSON.parse(document.getElementById("state").textContent);
    var pr = (st.blocks || []).filter(function (b) { return b.type === "promo"; })[0];
    var sl = pr && (pr.slides || []).filter(function (s) { return s.kind === "video" && s.src; })[0];
    if (!sl) return;
    var box = document.createElement("div"); box.id = "splash";
    var v = document.createElement("video");
    v.src = sl.src; if (sl.poster) v.poster = sl.poster;
    v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.autoplay = true;
    var skip = document.createElement("button"); skip.type = "button"; skip.textContent = "Пропустить ✕";
    // квадратный ролик на вытянутом экране: полосы сверху и снизу — размытый кадр из того же ролика
    if (sl.poster) { var bg = document.createElement("div"); bg.className = "blur"; bg.style.backgroundImage = 'url("' + sl.poster + '")'; box.append(bg); }
    box.append(v, skip); document.body.append(box);
    var done = false;
    function close() {
      if (done) return; done = true;
      box.classList.add("out"); v.pause();
      setTimeout(function () { box.remove(); }, 600);
    }
    v.addEventListener("ended", close);
    v.addEventListener("error", close);
    box.addEventListener("click", close);
    setTimeout(function () { skip.classList.add("on"); }, 900);
    setTimeout(close, 9500);  // на случай, если видео не запустилось
    var p = v.play(); if (p && p.catch) p.catch(function () { setTimeout(close, 2500); });
  } catch (e) {}
})();
</script>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;  // открыли не из Telegram — обычная страница
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#050812"); tg.setBackgroundColor("#050812"); } catch (e) {}
  // ссылки: t.me — внутри Telegram, остальные — во внешнем браузере (мини-приложение не закрывается)
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented) return;  // свайп карусели — не переход
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a || !/^https?:/i.test(a.href)) return;
    e.preventDefault();
    if (/^https?:\/\/t\.me\//i.test(a.href)) tg.openTelegramLink(a.href); else tg.openLink(a.href);
  });
})();
</script></body></html>
